name: Build publication

on:
  push:
    branches: [main, dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publication
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Build with the pinned engine image
        run: docker run --rm -v ${{ github.workspace }}:/publication ghcr.io/mvesanen/rytv-builder:0.1.3

      - name: Upload the publication artefact
        uses: actions/upload-artifact@v4
        with:
          name: publication
          path: artefact/

  pages:
    needs: build
    if: github.event_name == 'release' || (github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Check out the publication
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          path: publication

      - name: Download the built publication
        uses: actions/download-artifact@v4
        with:
          name: publication
          path: artefact

      - name: Use Actions to serve Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi

      - name: Fetch the Pages archive
        run: |
          set -euo pipefail
          git -C publication fetch origin "+refs/heads/gh-pages:refs/remotes/origin/gh-pages" || true
          rm -rf site
          if git -C publication show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git -C publication worktree add -B gh-pages "$GITHUB_WORKSPACE/site" origin/gh-pages
          else
            git -C publication worktree add --orphan -b gh-pages "$GITHUB_WORKSPACE/site"
          fi
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update the Pages tree
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            python publication/.github/scripts/update_pages.py site artefact --release "${GITHUB_REF_NAME}"
            message="Publish version ${GITHUB_REF_NAME}"
          else
            python publication/.github/scripts/update_pages.py site artefact --dev
            message="Publish the dev preview"
          fi
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo "Pages tree is unchanged"
          else
            git -C site commit -m "$message"
            git -C site push origin HEAD:gh-pages
          fi

      - name: Copy the site without git metadata
        run: rsync -a --exclude .git site/ public/

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
